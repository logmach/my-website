<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nol→805 · Belajar GMAT dari Nol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kertas:#F3F5FB;
  --putih:#FFFFFF;
  --tinta:#141B3D;
  --tinta2:#4A5378;
  --garis:#D9DEF0;
  --biru:#2D4DE0;
  --biru-l:#E4E9FD;
  --koral:#E44D6C;
  --koral-l:#FCE4EA;
  --teal:#0E9E96;
  --teal-l:#DCF3F1;
  --kuning:#FFC53D;
  --kuning-l:#FFF3D6;
  --hijau:#1C9E5A;
  --hijau-l:#DDF4E7;
  --merah:#D8384A;
  --merah-l:#FBE2E5;
  --r:14px;
  --shadow:0 4px 0 var(--tinta);
  --font-d:"Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --font-b:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-m:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-b);
  background:var(--kertas);
  background-image:radial-gradient(var(--garis) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--tinta);
  line-height:1.55;
  min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 90px}
button{font-family:inherit;cursor:pointer}

/* ===== Topbar ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(243,245,251,.9);backdrop-filter:blur(8px);
  border-bottom:2px solid var(--tinta);
  margin:0 -16px 18px;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.brand{font-family:var(--font-d);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .n{background:var(--tinta);color:var(--kuning);border-radius:8px;padding:1px 8px;font-family:var(--font-m);font-size:.9rem}
.tstats{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ===== Chips ===== */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.75rem;font-weight:700;
  border:2px solid var(--tinta);border-radius:999px;
  padding:3px 10px;background:var(--putih);white-space:nowrap;
}
.chip.xp{background:var(--kuning-l)}
.chip.lvl{background:var(--biru-l)}
.chip.soft{border-color:var(--garis);color:var(--tinta2);font-weight:600}
.chip.mini{font-size:.68rem;padding:2px 8px}

/* ===== Typography ===== */
.display{font-family:var(--font-d);font-weight:800;letter-spacing:-.03em;line-height:1.08}
h1.display{font-size:clamp(2.1rem,7vw,3.1rem);margin:8px 0 14px}
h2.display{font-size:clamp(1.35rem,4.5vw,1.7rem);margin-bottom:6px}
.eyebrow{font-family:var(--font-m);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--tinta2)}
.muted{color:var(--tinta2)}
.small{font-size:.85rem}
.mono{font-family:var(--font-m)}

/* ===== Cards ===== */
.card{
  background:var(--putih);
  border:2px solid var(--tinta);
  border-radius:var(--r);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card.flat{box-shadow:none;border-color:var(--garis)}
.card.acc{border-top:8px solid var(--acc,var(--biru))}

/* section accents */
.sec-Q{--acc:var(--biru);--acc-l:var(--biru-l)}
.sec-V{--acc:var(--koral);--acc-l:var(--koral-l)}
.sec-D{--acc:var(--teal);--acc-l:var(--teal-l)}
.dot{width:12px;height:12px;border-radius:4px;background:var(--acc,var(--biru));display:inline-block;border:2px solid var(--tinta)}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;font-size:1rem;
  background:var(--kuning);color:var(--tinta);
  border:2px solid var(--tinta);border-radius:12px;
  padding:12px 20px;
  box-shadow:var(--shadow);
  transition:transform .08s ease, box-shadow .08s ease;
  text-decoration:none;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--tinta)}
.btn.blok{width:100%}
.btn.biru{background:var(--biru);color:#fff}
.btn.ghost{background:var(--putih)}
.btn.kecil{padding:8px 14px;font-size:.85rem;box-shadow:0 3px 0 var(--tinta)}
.btn.kecil:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--biru);outline-offset:2px;border-radius:8px}

/* ===== Answer options ===== */
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--putih);
  border:2px solid var(--tinta);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;
  font-size:.95rem;font-weight:600;line-height:1.45;
  box-shadow:0 3px 0 var(--tinta);
  transition:transform .07s ease, box-shadow .07s ease, background .15s;
}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt .huruf{
  font-family:var(--font-m);font-weight:700;font-size:.8rem;
  border:2px solid var(--tinta);border-radius:8px;
  min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--kertas);flex-shrink:0;margin-top:1px;
}
.opt.benar{background:var(--hijau-l);border-color:var(--hijau);box-shadow:0 3px 0 var(--hijau)}
.opt.benar .huruf{background:var(--hijau);color:#fff;border-color:var(--hijau)}
.opt.salah{background:var(--merah-l);border-color:var(--merah);box-shadow:0 3px 0 var(--merah)}
.opt.salah .huruf{background:var(--merah);color:#fff;border-color:var(--merah)}
.opt.pilih{background:var(--biru-l)}
.opt.redup{opacity:.55}
.opt:disabled{cursor:default;transform:none}
.opt:disabled:active{transform:none;box-shadow:0 3px 0 var(--tinta)}
.opt.benar:disabled:active{box-shadow:0 3px 0 var(--hijau)}
.opt.salah:disabled:active{box-shadow:0 3px 0 var(--merah)}

/* ===== Progress bars ===== */
.bar{height:12px;background:var(--putih);border:2px solid var(--tinta);border-radius:99px;overflow:hidden}
.bar .isi{height:100%;background:var(--acc,var(--biru));border-radius:99px;transition:width .5s ease}
.bar.tebal{height:16px}

/* ===== Quiz ===== */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-size:1.02rem;font-weight:600;margin-bottom:16px;line-height:1.6}
.qtext .en{display:block}
.expl{
  background:var(--acc-l,var(--biru-l));
  border:2px solid var(--tinta);border-radius:12px;
  padding:14px;margin:6px 0 14px;font-size:.92rem;
  animation:muncul .3s ease;
}
.expl .lbl{font-family:var(--font-m);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:6px}
@keyframes muncul{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-family:var(--font-d);font-weight:800;font-size:1.15rem;margin-bottom:4px}
.verdict.ok{color:var(--hijau)} .verdict.no{color:var(--merah)}

/* ===== Tables in questions ===== */
.qtbl{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:.88rem;background:var(--putih)}
.qtbl th,.qtbl td{border:2px solid var(--tinta);padding:7px 9px;text-align:right}
.qtbl th:first-child,.qtbl td:first-child{text-align:left}
.qtbl th{background:var(--kertas);font-family:var(--font-m);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.qtbl caption{caption-side:top;text-align:left;font-family:var(--font-m);font-size:.72rem;color:var(--tinta2);padding-bottom:6px;text-transform:uppercase;letter-spacing:.08em}

/* ===== Lesson list ===== */
.trek{margin-bottom:22px}
.trek-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.trek-head h3{font-family:var(--font-d);font-weight:800;font-size:1.1rem;flex:1}
.trek-head .frac{font-family:var(--font-m);font-size:.78rem;color:var(--tinta2)}
.lrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--putih);border:2px solid var(--tinta);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--tinta);
  transition:transform .07s;
}
.lrow:active{transform:translateY(3px);box-shadow:none}
.lrow.kunci{opacity:.55;box-shadow:none;border-style:dashed;background:transparent}
.lrow.kunci:active{transform:none}
.lrow .ikon{
  font-size:1.25rem;width:44px;height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--acc-l,var(--biru-l));border:2px solid var(--tinta);border-radius:12px;
}
.lrow .info{flex:1;min-width:0}
.lrow .judul{font-weight:800;font-size:.95rem;line-height:1.3}
.lrow .sub{font-size:.75rem;color:var(--tinta2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.lrow .status{font-size:1.1rem;flex-shrink:0}
.cek{color:var(--hijau);font-weight:800}

/* ===== Score dial (signature) ===== */
.rapor{position:relative;overflow:hidden}
.rapor::after{
  content:"NOL → 805";position:absolute;right:-38px;top:16px;
  transform:rotate(35deg);
  font-family:var(--font-m);font-size:.62rem;letter-spacing:.2em;
  background:var(--kuning);border:2px solid var(--tinta);
  padding:3px 40px;color:var(--tinta);font-weight:700;
}
.dial{
  --p:0; width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--acc,var(--biru)) calc(var(--p)*1%), var(--garis) 0);
  border:2px solid var(--tinta);
  display:flex;align-items:center;justify-content:center;
  margin:6px auto 12px;
}
.dial .dalam{
  width:112px;height:112px;border-radius:50%;background:var(--putih);
  border:2px solid var(--tinta);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
.dial .angka{font-family:var(--font-m);font-weight:700;font-size:1.7rem;line-height:1}
.dial .dari{font-family:var(--font-m);font-size:.68rem;color:var(--tinta2)}
.secbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.secbar .nm{width:88px;font-size:.78rem;font-weight:800;flex-shrink:0}
.secbar .bar{flex:1}
.secbar .sk{font-family:var(--font-m);font-size:.75rem;width:38px;text-align:right;flex-shrink:0}

/* ===== Badges ===== */
.lencana-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lencana{
  border:2px solid var(--tinta);border-radius:12px;background:var(--putih);
  padding:10px 6px;text-align:center;box-shadow:0 3px 0 var(--tinta);
}
.lencana .em{font-size:1.5rem;display:block}
.lencana .nm{font-size:.68rem;font-weight:800;line-height:1.2;display:block;margin-top:4px}
.lencana .ds{font-size:.6rem;color:var(--tinta2);display:block;margin-top:2px;line-height:1.25}
.lencana.mati{opacity:.4;box-shadow:none;border-style:dashed;filter:grayscale(1)}

/* ===== Cards pager (lesson) ===== */
.kartu-materi{min-height:300px;display:flex;flex-direction:column}
.kartu-materi h3{font-family:var(--font-d);font-weight:800;font-size:1.2rem;margin-bottom:10px}
.kartu-materi .isi-materi{flex:1;font-size:.94rem}
.isi-materi p{margin-bottom:10px}
.isi-materi ul{margin:0 0 10px 20px}
.isi-materi li{margin-bottom:6px}
.isi-materi .rumus{
  font-family:var(--font-m);font-size:.86rem;background:var(--kertas);
  border:2px solid var(--garis);border-radius:10px;padding:10px 12px;margin:10px 0;
  overflow-x:auto;
}
.isi-materi .tip{
  border-left:6px solid var(--kuning);background:var(--kuning-l);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0;font-size:.88rem;
}
.isi-materi .tip b{display:block}
.isi-materi table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0}
.isi-materi table th,.isi-materi table td{border:2px solid var(--garis);padding:6px 8px;text-align:center}
.isi-materi table th{background:var(--kertas);font-family:var(--font-m);font-size:.72rem}
.reveal-btn{margin-top:8px}
.reveal-jwb{display:none;animation:muncul .3s ease}
.reveal-jwb.tampak{display:block}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--tinta);background:var(--putih)}
.dots span.aktif{background:var(--acc,var(--biru))}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,27,61,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:muncul .2s ease}
.modal{
  background:var(--putih);border:2px solid var(--tinta);border-bottom:none;
  border-radius:20px 20px 0 0;max-width:680px;width:100%;
  max-height:85vh;overflow-y:auto;padding:20px 18px 30px;
}
@media(min-width:700px){
  .modal-bg{align-items:center}
  .modal{border-radius:20px;border-bottom:2px solid var(--tinta);box-shadow:var(--shadow)}
}
.modal h3{font-family:var(--font-d);font-weight:800;font-size:1.25rem;margin-bottom:10px}
.modal p{font-size:.92rem;margin-bottom:10px}
textarea.kode{
  width:100%;font-family:var(--font-m);font-size:.72rem;
  border:2px solid var(--tinta);border-radius:10px;padding:10px;
  min-height:84px;background:var(--kertas);margin-bottom:10px;resize:vertical;
}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--tinta);color:#fff;font-weight:700;font-size:.88rem;
  border-radius:12px;padding:12px 18px;z-index:80;
  border:2px solid var(--tinta);box-shadow:0 4px 0 rgba(0,0,0,.25);
  animation:naik .3s ease;max-width:90vw;text-align:center;
}
@keyframes naik{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== Confetti ===== */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.conf{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:jatuh linear forwards}
@keyframes jatuh{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* ===== Misc ===== */
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--tinta);background:var(--kuning);border-radius:999px;padding:4px 12px}
.fitur{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.fitur .f{border:2px solid var(--tinta);border-radius:12px;background:var(--putih);padding:12px;box-shadow:0 3px 0 var(--tinta)}
.fitur .f .em{font-size:1.3rem}
.fitur .f b{display:block;font-size:.85rem;margin-top:4px}
.fitur .f span{font-size:.72rem;color:var(--tinta2)}
.filterrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:2px solid var(--tinta);border-radius:999px;background:var(--putih);font-weight:700;font-size:.8rem;padding:6px 14px;box-shadow:0 3px 0 var(--tinta)}
.fchip.on{background:var(--tinta);color:#fff}
.fchip:active{transform:translateY(3px);box-shadow:none}
details.rev{border:2px solid var(--garis);border-radius:12px;background:var(--putih);margin-bottom:8px;padding:0}
details.rev summary{cursor:pointer;padding:10px 12px;font-size:.85rem;font-weight:700;display:flex;gap:8px;align-items:center;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
details.rev .rincian{padding:0 12px 12px;font-size:.85rem;color:var(--tinta2)}
.spacer{height:8px}
hr.garis{border:none;border-top:2px dashed var(--garis);margin:16px 0}
.footnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="confetti"></div>
<script>
/* ============================================================
   NOL → 805 · Aplikasi belajar GMAT Focus Edition dari nol
   Bahasa antarmuka: Indonesia. Soal: Inggris (seperti tes asli).
   ============================================================ */
// ================= DATA: PILIHAN DATA SUFFICIENCY =================
const DS = [
  "Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.",
  "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.",
  "BOTH statements TOGETHER are sufficient, but NEITHER statement alone is sufficient.",
  "EACH statement ALONE is sufficient.",
  "Statements (1) and (2) TOGETHER are NOT sufficient."
];

// ================= DATA: TES PENEMPATAN (12 soal) =================
// diff: 1 mudah, 2 sedang, 3 sulit — dipakai untuk bobot skor
const PLACEMENT = [
  {sec:'Q', diff:1,
   text:`If 3x + 7 = 22, what is the value of x?`,
   opts:['3','5','7','9','15'], ans:1,
   expl:`Kurangi 7 dari kedua sisi: 3x = 15, lalu bagi 3: <b>x = 5</b>. Soal "pemanasan" seperti ini harus bisa diselesaikan dalam &lt;30 detik.`},

  {sec:'Q', diff:2,
   text:`A jacket priced at $120 is discounted by 25%. A 10% tax is then added to the discounted price. How much does a customer pay in total?`,
   opts:['$94.50','$96.00','$99.00','$102.00','$108.00'], ans:2,
   expl:`Diskon 25% → bayar 75%: 120 × 0,75 = 90. Tambah pajak 10%: 90 × 1,10 = <b>$99</b>. Ingat: perubahan persen berturut-turut <i>dikalikan</i>, bukan dijumlah (25% − 10% = 15% adalah jebakan).`},

  {sec:'Q', diff:2,
   text:`If n is a positive integer and 3n is even, which of the following must be true?<br><br>I. n is even<br>II. n&sup2; is even<br>III. n + 1 is odd`,
   opts:['I only','I and II only','II and III only','I, II, and III','None of the above'], ans:3,
   expl:`3 itu ganjil, jadi agar 3n genap, <b>n harus genap</b> (I benar). Genap dikuadratkan tetap genap (II benar). Genap + 1 = ganjil (III benar). Jawaban: <b>I, II, dan III</b>. Tipe "must be true" seperti ini adalah favorit GMAT.`},

  {sec:'Q', diff:3,
   text:`Working alone, machine A can complete a job in 6 hours and machine B can complete the same job in 8 hours. If the two machines work together for 2 hours, what fraction of the job remains unfinished?`,
   opts:['7/24','5/12','7/12','1/2','2/3'], ans:1,
   expl:`Laju A = 1/6 per jam, laju B = 1/8 per jam. Bersama: 1/6 + 1/8 = 4/24 + 3/24 = 7/24 per jam. Dalam 2 jam selesai 14/24 = 7/12. Sisa = 1 − 7/12 = <b>5/12</b>.`},

  {sec:'V', diff:1,
   text:`<i>Remote employees at Kirana Corp report higher job satisfaction than office employees, and satisfied employees tend to stay at their companies longer. Therefore, Kirana Corp should allow all of its employees to work remotely.</i><br><br>Which of the following is the main conclusion of the argument?`,
   opts:[
     'Remote employees at Kirana Corp report higher job satisfaction than office employees.',
     'Satisfied employees tend to stay at their companies longer.',
     'Kirana Corp should allow all of its employees to work remotely.',
     'Kirana Corp wants to reduce employee turnover.',
     'All employees prefer working remotely.'
   ], ans:2,
   expl:`Kata sinyal <b>"Therefore"</b> menandai kesimpulan: perusahaan <i>sebaiknya</i> mengizinkan semua karyawan bekerja jarak jauh. Pilihan A dan B adalah <b>premis</b> (bukti), D dan E tidak pernah dinyatakan.`},

  {sec:'V', diff:2,
   text:`<i>Bayu Coffee's sales rose 40% in the month after it began advertising on social media. Clearly, the advertising campaign caused the increase in sales.</i><br><br>Which of the following, if true, most seriously weakens the argument?`,
   opts:[
     'The advertising campaign reached over 100,000 social media users.',
     'The sales increase occurred during a month-long national coffee festival that boosted sales at coffee shops throughout the city.',
     'Bayu Coffee&rsquo;s tea sales remained flat during the same month.',
     'The advertisements were designed by a professional marketing agency.',
     'Some customers say they dislike seeing advertisements on social media.'
   ], ans:1,
   expl:`Argumen ini kausal: "iklan → penjualan naik". Cara terkuat melemahkannya: tunjukkan <b>sebab alternatif</b>. Festival kopi nasional yang menaikkan penjualan di semua kedai menjelaskan kenaikan tanpa perlu iklan. Pilihan lain tidak menyentuh hubungan sebab-akibatnya.`},

  {sec:'V', diff:3,

  {h:'Lima aturan eksponen',

  {h:'Jarak = Kecepatan × Waktu',
   b:`<div class="rumus">D = R × T   →   R = D/T   →   T = D/R</div>

   <p>Contoh: pergi 60 km dengan 30 km/jam (2 jam), pulang 60 km dengan 60 km/jam (1 jam). Rata-rata = 120 km ÷ 3 jam = <b>40 km/jam</b> — bukan 45!</p>

{id:'q5', sec:'Q', tier:3, icon:'📈',
 title:'Statistik & Himpunan Tumpang Tindih',
 tag:'Mahir',
 cards:[
  {h:'Mean, median, dan trik "jumlah"',
   b:`<div class="rumus">Mean = Jumlah ÷ Banyak   ⇄   Jumlah = Mean × Banyak</div>
   <p>Bentuk kedua sering lebih berguna! Soal "rata-rata berubah setelah satu data dibuang" hampir selalu diselesaikan lewat <b>jumlah total</b>, bukan rata-ratanya.</p>
   <p><b>Median</b> = nilai tengah setelah <i>diurutkan</i> (jika genap: rata-rata dua nilai tengah). Median kebal terhadap nilai ekstrem; mean tidak.</p>`},
  {h:'Standar deviasi: intuisi, bukan rumus',
   b:`<p>GMAT hampir tidak pernah menyuruhmu <i>menghitung</i> SD. Yang diuji adalah intuisi:</p>
   <ul>
   <li>SD mengukur seberapa <b>menyebar</b> data dari mean.</li>
   <li><b>Tambah konstanta</b> ke semua data → SD <b>tidak berubah</b> (semuanya bergeser bersama).</li>
   <li><b>Kali konstanta</b> c → SD ikut terkali |c|.</li>
   <li>Semua data sama → SD = 0 (sebaran terkecil yang mungkin).</li>
   </ul>
   <button class="btn kecil ghost reveal-btn" onclick="ungkap(this)">Mana yang SD-nya lebih besar: {5, 5, 5, 5} atau {1, 5, 5, 9}?</button>
   <div class="reveal-jwb"><div class="tip"><b>Jawaban</b> {1, 5, 5, 9}. Mean keduanya 5, tapi himpunan kedua menyebar jauh dari mean, himpunan pertama tidak menyebar sama sekali (SD = 0).</div></div>`},
  {h:'Himpunan tumpang tindih',
   b:`<div class="rumus">Total = A + B − (Keduanya) + (Bukan keduanya)</div>
   <p>Contoh: kelas 40 siswa, 25 ambil ekonomi, 18 ambil matematika, 8 ambil keduanya. Yang tidak ambil keduanya?</p>
   <div class="rumus">40 = 25 + 18 − 8 + N  →  N = 5</div>
   <p>Kenapa dikurangi "keduanya"? Karena 8 siswa itu terhitung dua kali (di grup ekonomi <i>dan</i> matematika). Untuk soal dengan dua kriteria ya/tidak, tabel 2×2 (double matrix) lebih ampuh lagi.</p>`},
  {h:'Deret berjarak sama: dua rumus sakti',
   b:`<p>Untuk bilangan berurutan atau berjarak sama (consecutive / evenly spaced):</p>
   <div class="rumus">Mean = Median = (awal + akhir) / 2
Jumlah = Mean × Banyak
Banyak bilangan a..b = b − a + 1</div>
   <p>Jumlah 1 sampai 60? Mean = (1 + 60)/2 = 30,5. Banyak = 60. Jumlah = 30,5 × 60 = <b>1.830</b>. Legenda mengatakan Gauss kecil melakukannya dalam hitungan detik — sekarang kamu juga bisa.</p>`}
 ],
 quiz:[
  {sec:'Q', diff:2, text:`The average (arithmetic mean) of 5 numbers is 20. When one of the numbers is removed, the average of the remaining 4 numbers is 18. What is the number that was removed?`,
   opts:['20','22','24','26','28'], ans:4,
   expl:`Jumlah awal = 5 × 20 = 100. Jumlah sisa = 4 × 18 = 72. Yang dibuang = 100 − 72 = <b>28</b>. Selalu bekerja lewat jumlah total.`},
  {sec:'Q', diff:2, text:`In a class of 40 students, 25 study economics, 18 study mathematics, and 8 study both. How many students study neither subject?`,
   opts:['3','5','7','9','13'], ans:1,
   expl:`40 = 25 + 18 − 8 + N → 40 = 35 + N → N = <b>5</b>.`},
  {sec:'Q', diff:3, text:`What is the sum of all the integers from 1 to 60, inclusive?`,
   opts:['1.770','1.800','1.830','1.860','3.660'], ans:2,
   expl:`Mean = (1 + 60)/2 = 30,5; banyak bilangan = 60; jumlah = 30,5 × 60 = <b>1.830</b>.`}
 ]},

{id:'v1', sec:'V', tier:1, icon:'🧩',
 title:'Anatomi Argumen: Premis, Kesimpulan, Asumsi',
 tag:'Pemula',
 cards:[
  {h:'Kenalan dengan Verbal GMAT Focus',
   b:`<p>Verbal Reasoning: <b>23 soal dalam 45 menit</b>, hanya dua jenis: <b>Reading Comprehension</b> (bacaan) dan <b>Critical Reasoning</b> (penalaran kritis). Sentence Correction sudah dihapus di GMAT Focus Edition — kamu tidak perlu menghafal grammar rumit!</p>
   <p>Verbal bukan tes kosakata. Ini tes <b>logika berbahasa Inggris</b>. Bacalah seperti pengacara: apa yang <i>diklaim</i>, apa <i>buktinya</i>, dan apa <i>celahnya</i>.</p>
   <div class="tip"><b>💡 Untuk non-native speaker</b> Kamu tidak harus paham setiap kata. Kamu harus paham <i>struktur</i>: mana klaim, mana bukti, ke mana arah kalimat.</div>`},
  {h:'Premis dan kesimpulan',
   b:`<p>Setiap argumen punya dua bagian inti:</p>
   <ul>
   <li><b>Premis</b> = bukti/alasan. Kata sinyal: <i>because, since, after all, given that</i>.</li>
   <li><b>Kesimpulan</b> = klaim yang dibela. Kata sinyal: <i>therefore, thus, hence, so, clearly, should</i>.</li>
   </ul>
   <div class="rumus">"Since remote work boosts satisfaction (PREMIS),
and satisfied staff stay longer (PREMIS),
the firm SHOULD go remote (KESIMPULAN)."</div>
   <p>Awas: kesimpulan tidak selalu di akhir kalimat. Kadang di awal, kadang di tengah. Kata sinyal-lah pemandunya, bukan posisi.</p>`},
  {h:'Asumsi: jembatan yang tak terucap',
   b:`<p><b>Asumsi</b> = sesuatu yang harus benar agar premis benar-benar menopang kesimpulan, tapi <i>tidak dituliskan</i>.</p>
   <div class="rumus">"Hujan turun. Jadi jalanan pasti macet."
Asumsi: hujan memengaruhi lalu lintas di sini,
dan tidak ada hal lain yang mencegah kemacetan.</div>
   <p>Bayangkan argumen sebagai jembatan: premis di satu sisi, kesimpulan di sisi lain. Asumsi adalah tiang di tengah yang tak terlihat — cabut tiangnya, jembatan runtuh.</p>`},
  {h:'Kebiasaan emas sebelum melihat pilihan',
   b:`<p>Untuk SETIAP soal Critical Reasoning, sebelum membaca pilihan jawaban:</p>
   <ul>
   <li>1️⃣ Temukan <b>kesimpulan</b> (klaim utama).</li>
   <li>2️⃣ Temukan <b>premis</b> (kenapa penulis percaya itu).</li>
   <li>3️⃣ Tanyakan: "apa yang penulis <i>anggap benar</i> tanpa bukti?"</li>
   </ul>
   <p>Pilihan jawaban GMAT dirancang untuk menggoda pembaca yang belum memetakan argumen. Peta dulu, jawaban belakangan — kamu akan heran betapa banyak jebakan yang jadi transparan.</p>`}
 ],
 quiz:[
  {sec:'V', diff:1, text:`<i>Prices of raw coffee beans doubled this year, yet Kafe Rimba has not raised its menu prices. Therefore, Kafe Rimba&rsquo;s profit margin on coffee drinks must have shrunk.</i><br><br>Which of the following is the conclusion of the argument?`,
   opts:[
     'Prices of raw coffee beans doubled this year.',
     'Kafe Rimba has not raised its menu prices.',
     'Kafe Rimba&rsquo;s profit margin on coffee drinks must have shrunk.',
     'Kafe Rimba should raise its menu prices.',
     'Coffee drinks are Kafe Rimba&rsquo;s main product.'
   ], ans:2,
   expl:`"<b>Therefore</b>" menandai kesimpulan: margin laba pasti menyusut. A dan B adalah premis; D dan E tidak pernah dinyatakan dalam argumen.`},
  {sec:'V', diff:1, text:`In an argument, the word "therefore" most typically introduces`,
   opts:['a premise','the conclusion','background information','a counterexample','an analogy'], ans:1,
   expl:`<i>Therefore, thus, hence, so</i> → kesimpulan. <i>Because, since, given that</i> → premis. Hafalkan dua keluarga kata sinyal ini.`},
  {sec:'V', diff:2, text:`<i>After the airport was expanded, noise complaints in Cempaka district doubled. Clearly, the expansion caused the increase in complaints.</i><br><br>The argument assumes which of the following?`,
   opts:[
     'Residents of Cempaka dislike all airports.',
     'The airport will continue to expand in the future.',
     'No other significant change in the district could explain the rise in complaints.',
     'Noise complaints decreased in other districts.',
     'Complaints doubled in every district of the city.'
   ], ans:2,
   expl:`Argumen kausal "ekspansi → keluhan" bersandar pada asumsi <b>tidak ada penyebab lain</b>. Uji negasi: kalau ADA perubahan besar lain (misal pabrik baru), argumen runtuh. A terlalu ekstrem, B–E tidak relevan atau justru melemahkan.`}
 ]},

{id:'v2', sec:'V', tier:2, icon:'⚔️',
 title:'Critical Reasoning: Weaken & Strengthen',
 tag:'Menengah',
 cards:[
  {h:'Pola kausal dan tiga serangannya',
   b:`<p>Argumen paling umum di GMAT: <b>"X terjadi, lalu Y terjadi → X menyebabkan Y."</b> Ada tiga cara klasik menyerangnya:</p>
   <ul>
   <li>🅰️ <b>Sebab alternatif</b>: hal lain (Z) yang menyebabkan Y.</li>
   <li>🅱️ <b>Arah terbalik</b>: jangan-jangan Y yang menyebabkan X.</li>
   <li>🅲 <b>Kebetulan/tren umum</b>: Y naik di mana-mana, bukan cuma di tempat X.</li>
   </ul>
   <div class="rumus">"Penjualan es krim naik, kejahatan naik.
Es krim menyebabkan kejahatan?"
→ Sebab alternatif: musim panas menaikkan keduanya.</div>`},
  {h:'Weaken: melemahkan, bukan menghancurkan',
   b:`<p>Jawaban <b>weaken</b> yang benar cukup <i>menurunkan keyakinan</i> pada kesimpulan — tidak perlu membuktikan salah 100%.</p>
   <p>Jebakan pilihan salah yang paling umum:</p>
   <ul>
   <li><b>Di luar cakupan</b>: membahas hal lain yang terdengar terkait.</li>
   <li><b>Malah menguatkan</b>: arah efeknya terbalik dari yang diminta.</li>
   <li><b>Menyerang premis</b>: di GMAT, premis dianggap fakta. Serang <i>hubungan</i> premis→kesimpulan, bukan faktanya.</li>
   </ul>`},
  {h:'Strengthen: menambal celah',
   b:`<p>Cara menguatkan argumen kausal:</p>
   <ul>
   <li>✅ <b>Singkirkan sebab alternatif</b> ("faktor lain terkendali/tidak berubah").</li>
   <li>✅ <b>Tambahkan mekanisme</b> (jelaskan <i>bagaimana</i> X menyebabkan Y).</li>
   <li>✅ <b>Bukti pembanding/eksperimen</b> ("saat X dihilangkan, Y ikut turun" atau "kelompok tanpa X tidak mengalami Y").</li>
   </ul>
   <div class="tip"><b>💡 Uji arah</b> Sebelum memilih, tanya: "kalau pernyataan ini benar, keyakinanku pada kesimpulan NAIK atau TURUN?" Banyak jebakan gugur di uji sederhana ini.</div>`},
  {h:'Contoh dibedah',
   b:`<div class="rumus">"Sales at Toko Sinar rose after it repainted
its storefront. The new paint caused the rise."</div>
   <p><b>Weaken terkuat:</b> "Renovasi mal di sebelah selesai bulan yang sama, menaikkan kunjungan ke semua toko di area itu" → sebab alternatif.</p>
   <p><b>Strengthen terkuat:</b> "Toko cabang lain yang tidak dicat ulang tidak mengalami kenaikan penjualan pada periode yang sama" → menyingkirkan tren umum, mengisolasi efek cat.</p>
   <p>Perhatikan: keduanya bekerja pada <i>hubungan sebab-akibat</i>, bukan pada fakta penjualannya.</p>`}
 ],
 quiz:[
  {sec:'V', diff:2, text:`<i>After Toko Sinar installed self-checkout machines, its losses from theft rose by 15%. The store&rsquo;s managers concluded that the machines make theft easier.</i><br><br>Which of the following, if true, most seriously weakens the managers&rsquo; conclusion?`,
   opts:[
     'The machines reduced average checkout waiting times.',
     'During the same period, theft losses rose by a similar percentage at comparable stores without self-checkout machines.',
     'A majority of customers now use the self-checkout machines.',
     'The store plans to install additional machines next year.',
     'Employees received training on how to operate the machines.'
   ], ans:1,
   expl:`Jika toko <i>tanpa</i> mesin juga mengalami kenaikan serupa, kenaikan itu kemungkinan tren umum (misal kondisi ekonomi), bukan efek mesin — <b>sebab alternatif</b> yang melemahkan kesimpulan kausal. Pilihan lain tidak menyentuh hubungan mesin→pencurian.`},
  {sec:'V', diff:2, text:`<i>Students who eat breakfast score higher on morning exams than students who skip it. Therefore, eating breakfast improves exam performance.</i><br><br>Which of the following, if true, most strengthens the argument?`,
   opts:[
     'Students who eat breakfast tend to come from families that can also afford private tutoring.',
     'When a group of students who usually skipped breakfast began eating it regularly, their morning exam scores improved.',
     'Breakfast foods vary widely in nutritional content.',
     'Many students report feeling hungry during morning classes.',
     'The school cafeteria recently expanded its breakfast menu.'
   ], ans:1,
   expl:`Ini bukti <b>eksperimen</b>: kelompok yang sama, satu variabel diubah (mulai sarapan), hasil membaik → memperkuat hubungan kausal langsung. Pilihan A justru <i>melemahkan</i> (sebab alternatif: les privat). C–E tidak relevan.`},
  {sec:'V', diff:3, text:`<i>Airline Nusa&rsquo;s on-time arrival rate improved from 70% to 85% in the year after it hired a new head of operations. Therefore, the new head of operations caused the improvement.</i><br><br>Which of the following, if true, most seriously weakens the argument?`,
   opts:[
     'The new head of operations has twenty years of industry experience.',
     'The improvement coincided with a year of unusually calm weather across the airline&rsquo;s entire network.',
     'Ticket prices rose slightly during the same year.',
     'The airline&rsquo;s main competitor saw its on-time rate worsen that year.',
     'The airline added two new destinations during the year.'
   ], ans:1,
   expl:`Cuaca yang luar biasa tenang adalah <b>sebab alternatif</b> yang kuat untuk perbaikan ketepatan waktu — melemahkan klaim bahwa kepala operasional barulah penyebabnya. A dan D cenderung menguatkan; C dan E tidak relevan langsung.`}
 ]},

{id:'v3', sec:'V', tier:2, icon:'📖',
 title:'Reading Comprehension: Baca untuk Struktur',
 tag:'Menengah',
 cards:[
  {h:'Prinsip #1: struktur, bukan detail',
   b:`<p>Kesalahan terbesar pemula: mencoba <i>menghafal</i> isi bacaan. Detail selalu bisa dicari ulang — yang harus kamu bangun saat membaca adalah <b>peta struktur</b>:</p>
   <ul>
   <li>Apa <b>fungsi</b> tiap paragraf? (memperkenalkan teori? menyanggah? memberi contoh?)</li>
   <li>Apa <b>sikap penulis</b>? (netral? mendukung? skeptis?)</li>
   <li>Di mana informasi X berada — bukan apa persisnya.</li>
   </ul>
   <div class="tip"><b>💡 Satu kalimat per paragraf</b> Setelah tiap paragraf, rangkum fungsinya dalam satu kalimat pendek di kepala: "P1 = pandangan lama, P2 = temuan baru yang menggugat, P3 = kualifikasi."</div>`},
  {h:'Empat tipe soal RC',
   b:`<ul>
   <li><b>Main idea / primary purpose</b>: jawaban harus mencakup seluruh bacaan — terlalu sempit atau terlalu luas sama-sama salah.</li>
   <li><b>Detail</b> ("according to the passage"): jawabannya <i>tertulis</i> di teks, biasanya diparafrasekan.</li>
   <li><b>Inference</b>: TIDAK tertulis, tapi harus <b>100% didukung</b> teks. Bukan "masuk akal di dunia nyata".</li>
   <li><b>Function</b> ("in order to"): mengapa penulis menaruh kalimat/paragraf itu di sana.</li>
   </ul>`},
  {h:'Galeri jawaban jebakan',
   b:`<ul>
   <li>🚩 <b>Kata ekstrem</b>: <i>always, never, only, all, prove</i> — teks GMAT hampir selalu berhati-hati; jawaban ekstrem hampir selalu salah.</li>
   <li>🚩 <b>Setengah benar</b>: paruh pertama akurat, paruh kedua menyelipkan klaim yang tak ada.</li>
   <li>🚩 <b>Benar tapi tidak ditanya</b>: fakta dari teks yang tidak menjawab pertanyaan.</li>
   <li>🚩 <b>Di luar teks</b>: pengetahuan umum yang tidak disebut bacaan.</li>
   </ul>
   <p>Kebiasaan bagus: untuk soal detail dan inference, <b>tunjuk baris</b> di teks yang mendukung jawabanmu. Tidak bisa menunjuk = jangan pilih.</p>`},
  {h:'Tips khusus non-native speaker',
   b:`<p>Jangan menerjemahkan kata per kata — tangkap <b>arah kalimat</b>. Kata-kata kecil ini adalah rambu belokan yang lebih penting dari kosakata sulit mana pun:</p>
   <table><tr><th>Rambu</th><th>Artinya</th></tr>
   <tr><td>however, but, yet</td><td>belokan / kontras</td></tr>
   <tr><td>although, despite</td><td>konsesi ("meskipun")</td></tr>
   <tr><td>moreover, furthermore</td><td>lanjut searah</td></tr>
   <tr><td>thus, consequently</td><td>kesimpulan</td></tr></table>
   <p>Kata sulit yang tidak kamu kenal? Lewati. Sembilan dari sepuluh kali, kamu tetap bisa menjawab dari struktur.</p>`}
 ],
 quiz:[
  {sec:'V', diff:2, text:`<i>In the 1850s, naturalist Alfred Russel Wallace noticed a puzzling boundary running through the Indonesian archipelago: islands only a few kilometers apart hosted strikingly different animals. West of the line, species resembled those of Asia; to the east, they resembled Australian fauna. Wallace proposed that deep ocean channels had isolated the two groups even when sea levels fell during ice ages, a hypothesis later supported by the discovery of plate tectonics. Some modern biologists, however, caution that the line is more gradient than wall: many birds and plants cross it freely, and its sharpness varies by species group. The boundary remains useful, they argue, but as a shorthand for a complex transition zone rather than an absolute divide.</i><br><br>The primary purpose of the passage is to`,
   opts:[
     'argue that Wallace&rsquo;s line should be discarded by modern science',
     'explain the origin of a biogeographic boundary and describe how its interpretation has been refined',
     'provide a biography of Alfred Russel Wallace',
     'prove that plate tectonics shaped the Indonesian archipelago',
     'compare the animals of Asia and Australia in detail'
   ], ans:1,
   expl:`Struktur: temuan Wallace → hipotesisnya → pandangan modern yang <i>memperhalus</i> (bukan membuang). Jawaban B menangkap keseluruhan. A terlalu ekstrem ("discarded" — teks bilang "remains useful"), C–E terlalu sempit atau bukan fokus.`},
  {sec:'V', diff:2, text:`According to the passage, Wallace&rsquo;s hypothesis about the boundary was later supported by`,
   opts:[
     'the migration patterns of birds',
     'measurements of sea levels during ice ages',
     'the discovery of plate tectonics',
     'the objections of modern biologists',
     'surveys of plant species'
   ], ans:2,
   expl:`Tertulis langsung: "a hypothesis later supported by <b>the discovery of plate tectonics</b>." Soal detail = tunjuk barisnya.`},
  {sec:'V', diff:3, text:`The passage suggests that the modern biologists mentioned would most likely agree with which of the following statements?`,
   opts:[
     'Wallace&rsquo;s original observations were mistaken.',
     'The boundary has no scientific value today.',
     'How sharply the boundary appears depends on which group of organisms is examined.',
     'Deep ocean channels never isolated any species.',
     'Birds are unable to cross the boundary.'
   ], ans:2,
   expl:`Teks: "its sharpness <b>varies by species group</b>" — inferensi yang didukung penuh. A, B, D bertentangan dengan teks ("remains useful"); E kebalikan dari yang tertulis ("many birds…cross it freely").`}
 ]},

{id:'v4', sec:'V', tier:3, icon:'🕵️',
 title:'CR Lanjutan: Assumption, Inference & Evaluate',
 tag:'Mahir',
 cards:[
  {h:'Necessary assumption & Tes Negasi',
   b:`<p><b>Necessary assumption</b> = sesuatu yang HARUS benar agar argumen tetap hidup. Alat ujinya legendaris:</p>
   <div class="rumus">TES NEGASI:
1. Negasikan pilihan jawaban.
2. Argumen runtuh? → itu asumsinya. ✓
3. Argumen baik-baik saja? → coret. ✗</div>
   <p>Hati-hati: jawaban yang <i>membantu</i> argumen belum tentu <i>diperlukan</i>. "Diperlukan" berarti tanpa dia, argumen mati.</p>`},
  {h:'Tes negasi dijalankan',
   b:`<div class="rumus">"EV vans cost less per km in energy than
fuel vans. So switching to EV vans will
cut the courier&rsquo;s operating costs."</div>
   <p>Kandidat asumsi: <i>"Penghematan energi tidak akan tertutupi oleh biaya lain yang lebih tinggi (perawatan, harga beli)."</i></p>
   <p><b>Negasikan:</b> "Penghematan energi AKAN tertutupi biaya lain." → kesimpulan "biaya operasional turun" langsung runtuh. ✓ Ini asumsinya.</p>
   <p>Bandingkan kandidat lain: "EV lebih ramah lingkungan." Negasikan → argumen biaya tetap berdiri → bukan asumsi.</p>`},
  {h:'Inference: pilih yang paling "aman"',
   b:`<p>Soal <i>inference / must be true</i>: pilih pernyataan yang <b>dijamin 100%</b> oleh teks. Bukan yang paling menarik, bukan yang paling mungkin — yang paling <b>tak terbantahkan</b>.</p>
   <ul>
   <li>Waspadai kata ekstrem (<i>all, never, most</i>) kecuali teksnya memang sekuat itu.</li>
   <li>Kuasai <b>kontrapositif</b>: "Semua A adalah B" + "X bukan B" → "X bukan A".</li>
   </ul>
   <div class="rumus">Semua peserta pelatihan lulus sertifikasi.
Rina tidak lulus sertifikasi.
→ Rina tidak ikut pelatihan. (pasti benar)</div>`},
  {h:'Evaluate & Boldface singkat',
   b:`<p><b>Evaluate the argument</b>: cari <i>pertanyaan</i> yang jawabannya (ya/tidak) bisa <b>menguatkan ATAU melemahkan</b> argumen. Uji dua arah: jawab "ya" → efeknya apa? Jawab "tidak" → efeknya apa? Kalau salah satu arah tidak berpengaruh, coret.</p>
   <p><b>Boldface</b>: dua kalimat ditebalkan, kamu diminta mengenali <i>perannya</i> (premis? kesimpulan utama? kesimpulan lawan? sanggahan?). Strategi: temukan dulu kesimpulan utama penulis, lalu tanya untuk tiap kalimat tebal: mendukung siapa?</p>`}
 ],
 quiz:[
  {sec:'V', diff:3, text:`<i>Kurir Kilat will replace its delivery vans with electric models in order to cut operating costs, since electricity per kilometer costs less than fuel.</i><br><br>Which of the following is an assumption on which the argument depends?`,
   opts:[
     'Electric vans are better for the environment than fuel vans.',
     'Fuel prices will continue to rise in the coming years.',
     'The savings on energy will not be outweighed by other, higher costs of operating the electric vans.',
     'All delivery companies will eventually switch to electric vans.',
     'Electric vans can travel farther in a day than fuel vans.'
   ], ans:2,
   expl:`Tes negasi: jika penghematan energi <i>tertutupi</i> biaya lain yang lebih tinggi, kesimpulan "memangkas biaya operasional" runtuh → C adalah asumsi yang diperlukan. A, B, D, E bisa dinegasikan tanpa membunuh argumen.`},
  {sec:'V', diff:2, text:`<i>Every employee who completed the training program passed the certification exam. Rina did not pass the certification exam.</i><br><br>If the statements above are true, which of the following must also be true?`,
   opts:[
     'Rina did not complete the training program.',
     'Rina failed the training program.',
     'Everyone who passed the exam completed the training.',
     'The training program is required for certification.',
     'Rina will retake the certification exam.'
   ], ans:0,
   expl:`Kontrapositif: "ikut pelatihan → lulus" + "Rina tidak lulus" → <b>Rina tidak ikut pelatihan (sampai selesai)</b>. B beda makna (gagal ≠ tidak menyelesaikan), C membalik arah logika, D dan E tidak didukung.`},
  {sec:'V', diff:3, text:`<i>A new toll road will cut travel time between two cities by half. Therefore, freight companies will shift their shipments from rail to road.</i><br><br>The answer to which of the following questions would be most useful in evaluating the argument?`,
   opts:[
     'How much did the toll road cost to build?',
     'Whether travel time is a major factor in freight companies&rsquo; choice between rail and road.',
     'Whether private car owners will use the new toll road.',
     'When the toll road was first proposed.',
     'Whether the two cities are connected by air routes.'
   ], ans:1,
   expl:`Uji dua arah: jika waktu tempuh memang faktor utama → argumen menguat; jika bukan (misal yang penting biaya/kapasitas) → argumen melemah. Pertanyaan B mengayun dua arah → paling berguna. Yang lain tidak memengaruhi kesimpulan.`}
 ]},

// ================= DATA: PELAJARAN DATA INSIGHTS =================
{id:'d1', sec:'D', tier:1, icon:'🔍',
 title:'Data Sufficiency 101',
 tag:'Pemula',
 cards:[
  {h:'Format paling aneh di GMAT',
   b:`<p><b>Data Sufficiency (DS)</b> memberi satu pertanyaan + dua pernyataan. Tugasmu <b>BUKAN menjawab pertanyaannya</b>, melainkan menilai: apakah datanya <i>cukup</i> untuk menjawab?</p>
   <p>Lima pilihan jawabannya <b>selalu sama</b> — hafalkan sampai mimpi:</p>
   <ul>
   <li><b>A</b> — (1) SAJA cukup; (2) saja tidak.</li>
   <li><b>B</b> — (2) SAJA cukup; (1) saja tidak.</li>
   <li><b>C</b> — GABUNGAN keduanya cukup; masing-masing sendiri tidak.</li>
   <li><b>D</b> — MASING-MASING sendiri sudah cukup.</li>
   <li><b>E</b> — Digabung pun tetap tidak cukup.</li>
   </ul>`},
  {h:'Alur kerja AD / BCE',
   b:`<p>Mulai selalu dari pernyataan (1), <b>sendirian</b>:</p>
   <div class="rumus">(1) cukup?   → jawaban tinggal A atau D
(1) tidak?   → jawaban tinggal B, C, atau E
lalu uji (2) SENDIRIAN → persempit lagi</div>
   <p>Kesalahan #1 pemula: saat menguji pernyataan (2), informasi dari (1) masih "nyangkut" di kepala. <b>Bersihkan memori!</b> Setiap pernyataan diuji dalam ruang hampa dulu; baru kalau keduanya gagal sendiri-sendiri, gabungkan (pilihan C vs E).</p>`},
  {h:'Dua jenis pertanyaan DS',
   b:`<ul>
   <li><b>Value</b> ("What is x?"): cukup = data mengunci <b>SATU nilai pasti</b>. Dua kemungkinan nilai = tidak cukup.</li>
   <li><b>Yes/No</b> ("Is x &gt; 0?"): cukup = jawabannya <b>PASTI ya</b> atau <b>PASTI tidak</b>.</li>
   </ul>
   <div class="tip"><b>⚡ Konsep terpenting DS</b> Jawaban "TIDAK" yang pasti itu CUKUP! "Is x positive?" dan datanya membuktikan x pasti negatif → jawabannya pasti "tidak" → data cukup. Banyak pemula mengira "tidak" berarti tidak cukup — itu keliru fatal.</div>`},
  {h:'Contoh dibedah',
   b:`<div class="rumus">Is x &gt; 0 ?
(1) x&sup2; = 16
(2) x&sup3; = 64</div>
   <p><b>(1)</b>: x = 4 atau x = −4 → kadang ya, kadang tidak → <b>tidak cukup</b>. (Coret A dan D.)</p>
   <p><b>(2)</b>: x&sup3; = 64 hanya punya satu solusi riil: x = 4 → pasti ya → <b>cukup</b>.</p>
   <p>Jawaban: <b>B</b>. Perhatikan bedanya: kuadrat menyimpan ambiguitas tanda, pangkat tiga tidak.</p>`}
 ],
 quiz:[
  {sec:'D', diff:1, ds:true, text:`What is the value of x?<br><br>(1) x + 3 = 10<br>(2) 2x &lt; 20`,
   opts:DS, ans:0,
   expl:`(1) x = 7 → satu nilai pasti → <b>cukup</b>. (2) x &lt; 10 → tak terhingga kemungkinan → tidak cukup. Jawaban: <b>A</b>.`},
  {sec:'D', diff:2, ds:true, text:`Is the integer n even?<br><br>(1) n + 1 is odd.<br>(2) 3n is even.`,
   opts:DS, ans:3,
   expl:`(1) n + 1 ganjil → n genap → pasti YA → cukup. (2) 3 ganjil, jadi 3n genap hanya jika n genap → pasti YA → cukup. Masing-masing cukup sendiri → <b>D</b>.`},
  {sec:'D', diff:2, ds:true, text:`What is the value of y?<br><br>(1) y&sup2; = 16<br>(2) y &lt; 0`,
   opts:DS, ans:2,
   expl:`(1) y = 4 atau −4 → tidak cukup. (2) y negatif → tak terhingga → tidak cukup. <b>Gabung:</b> y = −4 saja → satu nilai → cukup. Jawaban: <b>C</b>.`}
 ]},

{id:'d2', sec:'D', tier:2, icon:'🪤',
 title:'DS: Strategi Angka Uji & Jebakan',
 tag:'Menengah',
 cards:[
  {h:'Jebakan C: hadiah yang terlalu mudah',
   b:`<p>Kalau menggabungkan (1) + (2) terasa <i>jelas banget</i> cukup, curigalah. GMAT jarang memberi C secara cuma-cuma.</p>
   <p>Refleks yang benar: sebelum memilih C, cek ulang — <b>jangan-jangan salah satu pernyataan sudah cukup sendirian</b> (jawaban sebenarnya A, B, atau D). Pernyataan yang "tampak lemah" sering menyimpan informasi tersembunyi (misal: "n bilangan prima genap" → n = 2, terkunci!).</p>`},
  {h:'Jebakan E yang menyamar jadi C',
   b:`<p>Kebalikannya juga sering: gabungan (1) + (2) <i>terasa</i> cukup, padahal masih menyisakan dua kemungkinan.</p>
   <div class="rumus">Is x &gt; 5 ?
(1) x &gt; 3    (2) x &lt; 7
Gabung: 3 &lt; x &lt; 7
→ x = 4? tidak.  x = 6? ya.  → TIDAK CUKUP → E</div>
   <p>Disiplin terakhir sebelum menjawab C: <b>cari satu counterexample</b>. Ketemu → jawabannya E.</p>`},
  {h:'Angka uji sistematis',
   b:`<p>Untuk soal "is x…?" tanpa batasan eksplisit, WAJIB menguji keluarga angka ini:</p>
   <div class="rumus">0     1     −1     ½     −½     10</div>
   <ul>
   <li><b>0</b> membunuh klaim tentang tanda dan pembagian.</li>
   <li><b>Pecahan</b> membalik intuisi pangkat (½&sup2; = ¼ &lt; ½!).</li>
   <li><b>Negatif</b> membalik pertidaksamaan dan hasil kali.</li>
   </ul>
   <p>Kata "integer", "positive", "nonzero" di soal adalah <b>batasan emas</b> — garis bawahi selalu; mereka menentukan angka mana yang boleh diuji.</p>`},
  {h:'Sekali lagi: "TIDAK" yang pasti = CUKUP',
   b:`<div class="rumus">Is xy &gt; 0 ?
(1) x &gt; 0    (2) y &lt; 0</div>
   <p>(1) sendiri: y tidak diketahui → tidak cukup. (2) sendiri: x tidak diketahui → tidak cukup.</p>
   <p><b>Gabung:</b> positif × negatif = pasti negatif → xy pasti TIDAK &gt; 0 → jawaban pertanyaan adalah "tidak" yang <b>pasti</b> → data <b>CUKUP</b> → jawaban <b>C</b>.</p>
   <p>Kalau kamu tadi refleks menjawab E "karena jawabannya tidak", ulangi mantra ini: DS menanyakan <i>kepastian</i>, bukan <i>ya</i>.</p>`}
 ],
 quiz:[
  {sec:'D', diff:2, ds:true, text:`Is x &gt; 5?<br><br>(1) x &gt; 3<br>(2) x &lt; 7`,
   opts:DS, ans:4,
   expl:`Masing-masing jelas tidak cukup. Gabung: 3 &lt; x &lt; 7 → x bisa 4 (tidak) atau 6 (ya) → tetap tidak pasti → <b>E</b>. Jebakan klasik "kelihatan seperti C".`},
  {sec:'D', diff:2, ds:true, text:`Is xy &gt; 0?<br><br>(1) x &gt; 0<br>(2) y &lt; 0`,
   opts:DS, ans:2,
   expl:`Sendiri-sendiri tidak cukup. Gabung: x positif dan y negatif → xy <b>pasti negatif</b> → jawaban pasti "TIDAK" → itu tetap CUKUP! Jawaban: <b>C</b>. Ingat: kepastian "tidak" = data cukup.`},
  {sec:'D', diff:3, ds:true, text:`If k is a positive integer, is k a multiple of 6?<br><br>(1) k is a multiple of 3.<br>(2) k&sup2; is a multiple of 4.`,
   opts:DS, ans:2,
   expl:`(1) k = 3 (bukan) vs k = 6 (ya) → tidak cukup. (2) k&sup2; kelipatan 4 → k harus genap; k = 2 (bukan kelipatan 6) vs k = 12 (ya) → tidak cukup. <b>Gabung:</b> k genap DAN kelipatan 3 → kelipatan 6 → pasti YA → <b>C</b>.`}
 ]},

const app = document.getElementById('app');
const XP_PER = {1:10, 2:15, 3:20};

function esc(s){return s}
function scrollTop(){window.scrollTo({top:0,behavior:'auto'})}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.innerHTML=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s'},2200);
  setTimeout(()=>t.remove(),2700);
}

function confetti(n){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const warna=['#2D4DE0','#E44D6C','#0E9E96','#FFC53D','#1C9E5A','#141B3D'];
  const lay=document.getElementById('confetti');
  for(let i=0;i<(n||60);i++){
    const c=document.createElement('div');
    c.className='conf';
    c.style.left=Math.random()*100+'vw';
    c.style.background=warna[Math.floor(Math.random()*warna.length)];
    c.style.animationDuration=(1.1+Math.random()*1.2)+'s';
    c.style.animationDelay=(Math.random()*0.4)+'s';
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    lay.appendChild(c);
    setTimeout(()=>c.remove(),2900);
  }
}

function award(xp){ if(xp>0){ S.xp+=xp; } }

function checkBadges(){
  const baru=[];
  BADGES.forEach(b=>{ if(!S.badges[b.id] && b.tes(S)){ S.badges[b.id]=true; baru.push(b); } });
  baru.forEach((b,i)=>setTimeout(()=>{ toast('Lencana baru: '+b.em+' <b>'+b.nm+'</b>'); confetti(35); }, 400+i*1400));
}

function ungkap(btn){
  const j=btn.nextElementSibling;
  if(j){ j.classList.add('tampak'); btn.style.display='none'; }
}

function pct(x,y){ return y? Math.round(x/y*100):0 }

// progres per seksi (pelajaran)
function secProg(sec){
  const ls=LESSONS.filter(l=>l.sec===sec);
  return {done:ls.filter(l=>S.done[l.id]).length, total:ls.length};
}

// apakah pelajaran terbuka?
function unlocked(l){
  if(S.level>=3) return true;
  if(l.tier<=S.level) return true;
  const seksi=LESSONS.filter(x=>x.sec===l.sec);
  const idx=seksi.findIndex(x=>x.id===l.id);
  if(idx<=0) return l.tier<=1 || S.level>=l.tier;
  return !!S.done[seksi[idx-1].id];
}

// rekomendasi pelajaran berikutnya: seksi terlemah dulu
function nextLesson(){
  let urut=['Q','V','D'];
  if(S.pScore){
    urut=urut.slice().sort((a,b)=>
      (S.pScore.bySec[a]/S.pScore.maxSec[a]) - (S.pScore.bySec[b]/S.pScore.maxSec[b]));
  }
  // prioritas 1: belum selesai, terbuka, tier >= level (materi "baru")
  for(const sec of urut){
    const kandidat=LESSONS.filter(l=>l.sec===sec && !S.done[l.id] && unlocked(l) && l.tier>=Math.max(1,S.level));
    if(kandidat.length) return kandidat[0];
  }
  // prioritas 2: apa pun yang belum selesai & terbuka
  for(const sec of urut){
    const kandidat=LESSONS.filter(l=>l.sec===sec && !S.done[l.id] && unlocked(l));
    if(kandidat.length) return kandidat[0];
  }
  return null;
}

// ================= KODE PROGRES (simpan/muat manual) =================
function kodeSimpan(){
  const data={v:1, level:S.level, xp:S.xp, done:S.done, best:S.best,
              badges:S.badges, pScore:S.pScore, practiceDone:S.practiceDone};
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function kodeMuat(str){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if(!d || typeof d.level==='undefined') throw 0;
    S.level=d.level||0; S.xp=d.xp||0; S.done=d.done||{}; S.best=d.best||{};
    S.badges=d.badges||{}; S.pScore=d.pScore||null; S.practiceDone=d.practiceDone||{};
    S.screen = S.level? 'dash':'welcome';
    tutupModal(); render();
    toast('✅ Progres berhasil dimuat!');
  }catch(e){ toast('⚠️ Kode tidak valid. Periksa lagi salinanmu.'); }
}

// ================= RENDER UTAMA =================
function render(){
  let html='';
  if(S.screen==='welcome') html=rWelcome();
  else if(S.screen==='quiz') html=rQuiz();
  else if(S.screen==='presult') html=rPresult();
  else if(S.screen==='dash') html=rDash();
  else if(S.screen==='lesson') html=rLesson();
  else if(S.screen==='qresult') html=rQResult();
  html+=rModal();
  app.innerHTML=html;
}

// ---------- Tes penempatan ----------
function mulaiPlacement(){
  S.quiz={mode:'placement', qs:PLACEMENT, i:0, picked:null, locked:false,
          benar:0, xpDapat:0, jawaban:[]};
  S.screen='quiz'; scrollTop(); render();
}

// ---------- Mesin kuis (dipakai penempatan, pelajaran & latihan) ----------
function rQuiz(){
  const z=S.quiz, q=z.qs[z.i], n=z.qs.length;
  const judul = z.mode==='placement' ? '🧭 Tes Penempatan'
              : z.mode==='practice' ? '💪 Latihan Campuran' : '📝 Kuis: '+z.judul;
  const instan = z.mode!=='placement';
  let opsi='';
  q.opts.forEach((o,idx)=>{
    let cls='opt', dis='';
    if(instan && z.locked){
      dis='disabled';
      if(idx===q.ans) cls+=' benar';
      else if(idx===z.picked) cls+=' salah';
      else cls+=' redup';
    } else if(!instan && z.picked===idx){ cls+=' pilih'; }
    opsi+=`<button class="${cls}" ${dis} onclick="pilihOpt(${idx})">
      <span class="huruf">${String.fromCharCode(65+idx)}</span><span>${o}</span></button>`;
  });

  let umpan='';
  if(instan && z.locked){
    const ok=z.picked===q.ans;
    umpan=`<div class="expl"><span class="verdict ${ok?'ok':'no'}">${ok?'✓ Benar! +'+XP_PER[q.diff]+' XP':'✗ Belum tepat'}</span>
      <span class="lbl">Penjelasan</span>${q.expl}</div>
      <button class="btn blok" onclick="lanjutQ()">${z.i<n-1?'Lanjut →':'Lihat Hasil 🏁'}</button>`;
  } else {
    umpan=`<button class="btn blok" ${z.picked===null?'disabled':''} onclick="${instan?'kunciJawaban()':'lanjutQ()'}">
      ${instan?'Periksa Jawaban':(z.i<n-1?'Lanjut →':'Selesai 🏁')}</button>`;
  }

  const dshint = q.ds ? `<p class="small muted" style="margin:-6px 0 12px">💡 Format Data Sufficiency — arti pilihan A–E dibahas di pelajaran <b>DS 101</b>.</p>` : '';

  return `
  <div class="topbar"><div class="brand"><span class="n">N→805</span> ${judul}</div>
    <div class="tstats"><span class="chip xp">⚡ ${S.xp} XP</span></div></div>
  <div class="qhead">
    <span class="chip sec-${q.sec}" style="background:var(--acc-l)"><span class="dot"></span>&nbsp;${SECNAME[q.sec]}</span>
    <span class="chip soft mono">Soal ${z.i+1} / ${n}</span>
  </div>
  <div class="bar sec-${q.sec}" style="margin-bottom:16px"><div class="isi" style="width:${pct(z.i,n)}%"></div></div>
  <div class="card acc sec-${q.sec}">
    ${q.tbl||''}
    <div class="qtext">${q.text}</div>
    ${dshint}
    ${opsi}
  </div>
  ${umpan}`;
}

function pilihOpt(i){
  const z=S.quiz;
  if(z.locked) return;
  z.picked=i;
  if(z.mode!=='placement'){ kunciJawaban(); return; }
  render();
}

function kunciJawaban(){
  const z=S.quiz, q=z.qs[z.i];
  if(z.picked===null||z.locked) return;
  z.locked=true;
  if(z.picked===q.ans){ z.benar++; const xp=XP_PER[q.diff]; z.xpDapat+=xp; award(xp); }
  if(z.mode==='practice' && typeof q._pi!=='undefined'){ S.practiceDone[q._pi]=true; }
  render();
}

function lanjutQ(){
  const z=S.quiz, q=z.qs[z.i];
  if(z.mode==='placement'){
    if(z.picked===null) return;
    z.jawaban.push(z.picked);
    if(z.picked===q.ans) z.benar++;
  }
  if(z.i < z.qs.length-1){
    z.i++; z.picked=null; z.locked=false; scrollTop(); render();
  } else {
    if(z.mode==='placement') selesaiPlacement();
    else selesaiKuis();
  }
}

// ---------- Hasil tes penempatan ----------
function selesaiPlacement(){
  const z=S.quiz;
  let tot=0, max=0, bySec={Q:0,V:0,D:0}, maxSec={Q:0,V:0,D:0};
  PLACEMENT.forEach((q,i)=>{
    max+=q.diff; maxSec[q.sec]+=q.diff;
    if(z.jawaban[i]===q.ans){ tot+=q.diff; bySec[q.sec]+=q.diff; }
  });
  S.pScore={tot,max,bySec,maxSec,answers:z.jawaban.slice()};
  S.level = tot<=8 ? 1 : (tot<=16 ? 2 : 3);
  award(40);
  S.quiz=null; S.screen='presult'; scrollTop(); render();
  confetti(70); checkBadges();
}

function rPresult(){
  const p=S.pScore, lv=LVL[S.level];
  const persen=pct(p.tot,p.max);
  const lemah=['Q','V','D'].sort((a,b)=>(p.bySec[a]/p.maxSec[a])-(p.bySec[b]/p.maxSec[b]))[0];
  const bars=['Q','V','D'].map(s=>`
    <div class="secbar sec-${s}">
      <span class="nm"><span class="dot"></span> ${SECNAME[s]}</span>
      <div class="bar"><div class="isi" style="width:${pct(p.bySec[s],p.maxSec[s])}%"></div></div>
      <span class="sk mono">${p.bySec[s]}/${p.maxSec[s]}</span>
    </div>`).join('');
  const review=PLACEMENT.map((q,i)=>{
    const ok=p.answers[i]===q.ans;
    return `<details class="rev"><summary><span class="${ok?'cek':''}" style="${ok?'':'color:var(--merah);font-weight:800'}">${ok?'✓':'✗'}</span>
      Soal ${i+1} · ${SECNAME[q.sec]} <span class="chip mini soft" style="margin-left:auto">${'★'.repeat(q.diff)}</span></summary>
      <div class="rincian">${q.tbl||''}<p style="color:var(--tinta)">${q.text}</p>
      <p style="margin-top:8px"><b>Jawaban benar: ${String.fromCharCode(65+q.ans)}.</b> ${q.expl}</p></div></details>`;
  }).join('');
  return `
  <div style="padding-top:26px">
    <p class="eyebrow" style="text-align:center">Rapor Tes Penempatan</p>
    <div class="card rapor" style="margin-top:10px">
      <div class="dial sec-${lemah}" style="--p:${persen}">
        <div class="dalam"><span class="angka">${p.tot}<span style="font-size:.85rem;color:var(--tinta2)">/${p.max}</span></span>
        <span class="dari">poin terbobot</span></div>
      </div>
      <h2 class="display" style="text-align:center">${lv.em} Level kamu: ${lv.nm}</h2>
      <p class="small" style="text-align:center;margin:6px 0 16px">${lv.ds}</p>
      <hr class="garis">
      ${bars}
      <div class="tip" style="margin-top:14px"><b>🎯 Fokus pertamamu: ${SECNAME[lemah]}</b>
      Skor penempatanmu paling rendah di seksi ini, jadi rekomendasi belajarmu akan dimulai dari sana.</div>
    </div>
    <button class="btn blok biru" onclick="S.screen='dash';scrollTop();render()">Buka Jalur Belajarku 🗺️</button>
    <div class="spacer"></div><div class="spacer"></div>
    <p class="eyebrow" style="margin-bottom:8px">Review jawaban (ketuk untuk penjelasan)</p>
    ${review}
  </div>`;
}

// ---------- Dashboard ----------
function rDash(){
  const lv=LVL[S.level];
  const rec=nextLesson();
  const semuaSelesai=LESSONS.every(l=>S.done[l.id]);
  let hero='';
  if(semuaSelesai){
    hero=`<div class="card" style="background:var(--kuning-l)"><h2 class="display">🏆 Semua pelajaran selesai!</h2>
      <p class="small">Luar biasa. Asah terus lewat <b>Latihan Campuran</b>, atau ulangi tes penempatan untuk mengukur kemajuanmu.</p></div>`;
  } else if(rec){
    hero=`<div class="card acc sec-${rec.sec}">
      <p class="eyebrow">Lanjutkan belajar · ${SECNAME[rec.sec]}</p>
      <h2 class="display">${rec.icon} ${rec.title}</h2>
      <p class="small muted" style="margin-bottom:12px">${rec.cards.length} kartu materi + kuis ${rec.quiz.length} soal · level ${rec.tag}</p>
      <button class="btn" onclick="bukaPelajaran('${rec.id}')">Mulai →</button>
    </div>`;
  }

  const trek=['Q','V','D'].map(sec=>{
    const pr=secProg(sec);
    const rows=LESSONS.filter(l=>l.sec===sec).map(l=>{
      const buka=unlocked(l), selesai=S.done[l.id];
      const opsional = S.level>l.tier && !selesai ? `<span class="chip mini" style="background:var(--kuning-l)">review opsional</span>`:'';
      const status = selesai? `<span class="status cek">✓</span>` : buka? `<span class="status">→</span>` : `<span class="status">🔒</span>`;
      const skor = selesai && S.best[l.id]!=null ? `<span class="chip mini soft mono">kuis ${S.best[l.id]}/${l.quiz.length}</span>`:'';
      return `<button class="lrow sec-${sec} ${buka?'':'kunci'}" ${buka?'':'disabled'} onclick="bukaPelajaran('${l.id}')">
        <span class="ikon">${l.icon}</span>
        <span class="info"><span class="judul">${l.title}</span>
        <span class="sub"><span class="chip mini soft">${l.tag}</span>${opsional}${skor}</span></span>
        ${status}</button>`;
    }).join('');
    return `<div class="trek sec-${sec}">
      <div class="trek-head"><span class="dot"></span><h3>${SECFULL[sec]}</h3><span class="frac mono">${pr.done}/${pr.total}</span></div>
      <div class="bar" style="margin-bottom:12px"><div class="isi" style="width:${pct(pr.done,pr.total)}%"></div></div>
      ${rows}</div>`;
  }).join('');

  const nLatih=Object.keys(S.practiceDone).length;
  const lencana=BADGES.map(b=>`<div class="lencana ${S.badges[b.id]?'':'mati'}">
    <span class="em">${b.em}</span><span class="nm">${b.nm}</span><span class="ds">${b.ds}</span></div>`).join('');

  return `
  <div class="topbar"><div class="brand"><span class="n">N→805</span> Nol ke 805</div>
    <div class="tstats"><span class="chip lvl">${lv.em} ${lv.nm}</span><span class="chip xp">⚡ ${S.xp} XP</span></div></div>
  ${hero}
  ${trek}
  <div class="trek">
    <div class="trek-head"><span class="dot" style="background:var(--kuning)"></span><h3>Bank Latihan</h3><span class="frac mono">${nLatih}/${PRACTICE.length}</span></div>
    <button class="lrow" onclick="bukaModal('latihan')">
      <span class="ikon" style="background:var(--kuning-l)">💪</span>
      <span class="info"><span class="judul">Latihan Campuran</span>
      <span class="sub">12 soal lintas seksi · pilih filternya</span></span>
      <span class="status">→</span></button>
  </div>
  <p class="eyebrow" style="margin:4px 0 10px">Lencana (${Object.keys(S.badges).length}/${BADGES.length})</p>
  <div class="lencana-grid">${lencana}</div>
  <div class="spacer"></div><div class="spacer"></div>
  <div class="footnav">
    <button class="btn kecil ghost" onclick="bukaModal('ulang')">🧭 Ulangi tes penempatan</button>
    <button class="btn kecil ghost" onclick="bukaModal('progres')">💾 Simpan / muat progres</button>
    <button class="btn kecil ghost" onclick="bukaModal('tentang')">ℹ️ Tentang GMAT</button>
  </div>`;
}

// ---------- Pelajaran ----------
function bukaPelajaran(id){
  S.lessonView={id, card:0};
  S.screen='lesson'; scrollTop(); render();
}
function rLesson(){
  const l=LESSONS.find(x=>x.id===S.lessonView.id);
  const i=S.lessonView.card, n=l.cards.length, c=l.cards[i];
  const dots=l.cards.map((_,k)=>`<span class="${k===i?'aktif':''}"></span>`).join('');
  const tombol = i<n-1
    ? `<button class="btn" onclick="kartuNav(1)">Lanjut →</button>`
    : `<button class="btn biru" onclick="mulaiKuisPelajaran('${l.id}')">Mulai Kuis 🚀</button>`;
  return `
  <div class="topbar"><div class="brand"><button class="btn kecil ghost" onclick="S.screen='dash';scrollTop();render()">←</button>
    &nbsp;${l.icon} ${SECNAME[l.sec]}</div>
    <div class="tstats"><span class="chip xp">⚡ ${S.xp} XP</span></div></div>
  <p class="eyebrow">${l.title} · kartu ${i+1}/${n}</p>
  <div class="card acc sec-${l.sec} kartu-materi" style="margin-top:8px">
    <h3>${c.h}</h3>
    <div class="isi-materi sec-${l.sec}">${c.b}</div>
  </div>
  <div class="dots sec-${l.sec}">${dots}</div>
  <div class="btnrow" style="justify-content:space-between">
    <button class="btn ghost" ${i===0?'disabled':''} onclick="kartuNav(-1)">← Kembali</button>
    ${tombol}
  </div>`;
}
function kartuNav(d){
  S.lessonView.card=Math.max(0,Math.min(LESSONS.find(x=>x.id===S.lessonView.id).cards.length-1,S.lessonView.card+d));
  scrollTop(); render();
}
function mulaiKuisPelajaran(id){
  const l=LESSONS.find(x=>x.id===id);
  S.quiz={mode:'lesson', qs:l.quiz, i:0, picked:null, locked:false,
          benar:0, xpDapat:0, lessonId:id, judul:l.title};
  S.screen='quiz'; scrollTop(); render();
}

// ---------- Latihan campuran ----------
function mulaiLatihan(filter){
  let qs=PRACTICE.map((q,i)=>Object.assign({_pi:i},q));
  if(filter!=='ALL') qs=qs.filter(q=>q.sec===filter);
  S.quiz={mode:'practice', qs, i:0, picked:null, locked:false, benar:0, xpDapat:0, judul:'Latihan'};
  tutupModal(); S.screen='quiz'; scrollTop(); render();
}

// ---------- Hasil kuis pelajaran/latihan ----------
function selesaiKuis(){
  const z=S.quiz;
  let bonus=0;
  if(z.mode==='lesson'){
    if(!S.done[z.lessonId]){ S.done[z.lessonId]=true; bonus=30; award(30); }
    S.best[z.lessonId]=Math.max(S.best[z.lessonId]||0, z.benar);
  }
  z.bonus=bonus;
  S.screen='qresult'; scrollTop(); render();
  if(z.benar===z.qs.length) confetti(80);
  else if(z.benar>=Math.ceil(z.qs.length*0.6)) confetti(40);
  checkBadges();
}
function rQResult(){
  const z=S.quiz, n=z.qs.length;
  const sempurna=z.benar===n;
  const pesan= sempurna? '🎯 Sempurna! Kamu menguasai materi ini.'
    : z.benar>=Math.ceil(n*0.6)? '👍 Bagus! Baca lagi penjelasan soal yang salah, lalu lanjut.'
    : '💪 Tidak apa-apa — justru dari sinilah belajarnya. Ulangi kartu materinya, lalu coba lagi.';
  const ulang = z.mode==='lesson'
    ? `<button class="btn ghost blok" onclick="bukaPelajaran('${z.lessonId}')" style="margin-top:10px">📖 Baca ulang materi</button>`
    : `<button class="btn ghost blok" onclick="bukaModal('latihan')" style="margin-top:10px">🔁 Latihan lagi</button>`;
  return `
  <div style="padding-top:30px">
    <div class="card" style="text-align:center">
      <p class="eyebrow">${z.mode==='lesson'?'Kuis selesai':'Latihan selesai'}</p>
      <h1 class="display" style="margin:8px 0"><span class="mono">${z.benar}/${n}</span></h1>
      <p style="margin-bottom:10px">${pesan}</p>
      <span class="chip xp">⚡ +${z.xpDapat+(z.bonus||0)} XP${z.bonus?' (termasuk bonus selesai +30)':''}</span>
    </div>
    <button class="btn blok biru" onclick="S.quiz=null;S.screen='dash';scrollTop();render()">Kembali ke Jalur Belajar 🗺️</button>
    ${ulang}
  </div>`;
}

// ---------- Modal ----------
function bukaModal(m){ S.modal=m; render(); }
function tutupModal(){ S.modal=null; }
function rModal(){
  if(!S.modal) return '';
  let isi='';
  if(S.modal==='tentang'){
    isi=`<h3>ℹ️ Apa itu GMAT?</h3>
    <p><b>GMAT (Graduate Management Admission Test)</b> adalah tes standar berbahasa Inggris untuk mendaftar program MBA dan magister bisnis di seluruh dunia. Versi terbaru bernama <b>GMAT Focus Edition</b>.</p>
    <table class="qtbl"><tr><th>Seksi</th><th>Soal</th><th>Waktu</th></tr>
    <tr><td>Quantitative Reasoning</td><td>21</td><td>45 mnt</td></tr>
    <tr><td>Verbal Reasoning</td><td>23</td><td>45 mnt</td></tr>
    <tr><td>Data Insights</td><td>20</td><td>45 mnt</td></tr></table>
    <p>Total <b>skor 205–805</b>. Tesnya adaptif: soal berikutnya menyesuaikan performamu. Tidak ada kalkulator di Quant; kalkulator on-screen tersedia di Data Insights.</p>
    <p class="small muted">Aplikasi ini mengajarkan konsep dan strategi intinya dari nol — materi dalam Bahasa Indonesia, soal dalam bahasa Inggris agar kamu terbiasa dengan format aslinya.</p>
    <button class="btn blok" onclick="tutupModal();render()">Mengerti 👌</button>`;
  }
  if(S.modal==='latihan'){
    isi=`<h3>💪 Latihan Campuran</h3>
    <p class="small">12 soal orisinal lintas seksi dengan umpan balik instan. Mau fokus ke mana?</p>
    <div class="btnrow" style="flex-direction:column">
      <button class="btn blok" onclick="mulaiLatihan('ALL')">🌈 Semua seksi (12 soal)</button>
      <button class="btn blok ghost" onclick="mulaiLatihan('Q')">🧮 Quant saja (4 soal)</button>
      <button class="btn blok ghost" onclick="mulaiLatihan('V')">🗣️ Verbal saja (4 soal)</button>
      <button class="btn blok ghost" onclick="mulaiLatihan('D')">📊 Data Insights saja (4 soal)</button>
      <button class="btn blok kecil ghost" onclick="tutupModal();render()">Batal</button>
    </div>`;
  }
  if(S.modal==='ulang'){
    isi=`<h3>🧭 Ulangi tes penempatan?</h3>
    <p class="small">XP, pelajaran yang sudah selesai, dan lencanamu <b>tetap tersimpan</b>. Hanya level dan rapor penempatanmu yang dihitung ulang.</p>
    <div class="btnrow" style="flex-direction:column">
      <button class="btn blok" onclick="tutupModal();mulaiPlacement()">Ya, ukur ulang levelku</button>
      <button class="btn blok ghost" onclick="tutupModal();render()">Batal</button>
    </div>`;
  }
  if(S.modal==='progres'){
    isi=`<h3>💾 Simpan / muat progres</h3>
    <p class="small">Progres tersimpan selama halaman terbuka. Sebelum menutup halaman, salin <b>kode progres</b> di bawah (misalnya ke aplikasi catatan). Lain kali, tempel kembali untuk melanjutkan.</p>
    <p class="eyebrow">Kode progresmu</p>
    <textarea class="kode" readonly onclick="this.select()">${kodeSimpan()}</textarea>
    <button class="btn blok kecil" onclick="salinKode(this)">📋 Salin kode</button>
    <hr class="garis">
    <p class="eyebrow">Muat kode progres</p>
    <textarea class="kode" id="kodeIn" placeholder="Tempel kode progres di sini…"></textarea>
    <div class="btnrow">
      <button class="btn kecil" onclick="kodeMuat(document.getElementById('kodeIn').value)">Muat progres</button>
      <button class="btn kecil ghost" onclick="tutupModal();render()">Tutup</button>
    </div>`;
  }
  return `<div class="modal-bg" onclick="if(event.target===this){tutupModal();render()}"><div class="modal">${isi}</div></div>`;
}
function salinKode(btn){
  const ta=btn.previousElementSibling;
  ta.select(); ta.setSelectionRange(0,999999);
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value); }
    else{ document.execCommand('copy'); }
    toast('📋 Kode tersalin! Simpan di tempat aman.');
  }catch(e){ toast('Tekan lama pada kode, lalu pilih Salin.'); }
}

// ================= MULAI =================
render();
</script>
